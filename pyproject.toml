[project]
name = "builtup-mcp"
version = "0.1.0"
description = "On-demand MCP server that detects built-up change over small BBoxes by fusing Sentinel-1 SAR and Sentinel-2 optical, validated against Google Open Buildings 2.5D."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
]

[project.optional-dependencies]
# Phase 2: cloud-native Overture vector querying
vector = [
    "duckdb>=1.1.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
]
# Phase 3/4: cloud-native Sentinel-2 raster + processing
raster = [
    "pystac-client>=0.8.0",
    "rioxarray>=0.17.0",
    "rasterio>=1.3.0",
    "numpy>=1.26.0",
    "planetary-computer>=1.0.0",
    "scipy>=1.11.0",
    "contextily>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "matplotlib>=3.8.0",
]

[project.scripts]
builtup-mcp = "builtup_mcp:main"

[tool.pytest.ini_options]
markers = [
    "network: test requires network access (e.g. live Overture S3 query); deselect with -m 'not network'",
]

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"
