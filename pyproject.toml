[project]
name = "builtup-mcp"
version = "0.2.0"
description = "On-demand built-up change products (Sentinel-1/-2 composites, per-request classifier, STAC/COG delivery) behind an MCP server."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
]

[project.optional-dependencies]
# Phase 2: cloud-native Overture vector querying
vector = [
    "duckdb>=1.1.0",
    "geopandas>=1.0.0",
    "pyarrow>=17",
    "shapely>=2.0.0",
]
# Phase 3/4: cloud-native Sentinel-2 raster + processing
raster = [
    "pystac-client>=0.8.0",
    "rioxarray>=0.17.0",
    "rasterio>=1.3.0",
    "numpy>=1.26.0",
    "planetary-computer>=1.0.0",
    "scipy>=1.11.0",
    "contextily>=1.6.0",
    "scikit-learn>=1.5",
    "h3>=4.1",
    "zarr>=3.0",
    "obstore>=0.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "matplotlib>=3.8.0",
]

[project.scripts]
builtup-mcp = "builtup_mcp:main"
builtup-demo = "builtup_mcp.demo:main"
builtup-request = "builtup_mcp.cli:main"

[tool.pytest.ini_options]
markers = [
    "network: test requires network access (e.g. live Overture S3 query); deselect with -m 'not network'",
]

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"
